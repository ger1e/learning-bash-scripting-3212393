LOADING ROTUND_OPERATOR";position:absolute;font-size:9px;letter-spacing:.14em;color:var(--muted)}.catframe.ready:before{display:none}.catframe.error:before{content:"ASSET RETRY // REFRESH";color:var(--acid)}.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 70% 45%,rgba(75,255,132,.23),transparent 22%),linear-gradient(270deg,rgba(70,255,132,.12),transparent 38%);mix-blend-mode:screen}.signal,.label{position:absolute;z-index:3;border:1px solid var(--line);background:rgba(2,9,8,.82);padding:9px 11px;font-size:8px;letter-spacing:.13em;color:var(--muted)}.signal{right:18px;top:18px}.label{left:18px;bottom:18px}.signal b,.label b{color:var(--acid)}@media(max-width:980px){.hero{grid-template-columns:1fr}.copy{min-height:auto}.visual{min-height:520px}}@media(max-width:600px){.shell{width:calc(100% - 16px)}.navright a{display:none}.copy{padding:26px 20px}.name{font-size:clamp(38px,12vw,54px)}.visual{min-height:420px;padding:16px}.catframe{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
(async()=>{
  const cat=document.getElementById('cat'),frame=document.getElementById('catframe');
  try{const r=await fetch('./assets/rotund-operator.webp.b64',{cache:'force-cache'});if(!r.ok)throw new Error(String(r.status));const b=(await r.text()).trim();cat.onload=()=>{cat.classList.add('ready');frame.classList.add('ready')};cat.onerror=()=>frame.classList.add('error');cat.src='data:image/webp;base64,'+b}catch(e){frame.classList.add('error')}
})();

(()=>{
  const button=document.getElementById('sfx');
  let ctx,master,musicBus,reverb,delay,feedback,drumVerb,drumWet,timer,nextStep=0,step=0,audioOn=true,started=false;
  const bpm=148,sixteenth=60/bpm/4,lookAhead=.12;
  const midi=n=>440*Math.pow(2,(n-69)/12);
  const pent=[62,65,67,69,72];
  const arp=[62,74,62,69,77,67,74,62,65,77,69,62,72,67,79,69];
  const bass=[38,38,36,31];
  const pads=[[50,53,57,60],[48,50,55,57],[43,50,53,57],[45,50,55,60]];

  function impulse(sec=1.85,decay=4.1,gated=false){const rate=ctx.sampleRate,len=Math.floor(rate*sec),b=ctx.createBuffer(2,len,rate),gate=Math.floor(rate*(sec*.64));for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++){if(gated&&i>gate){d[i]=0;continue}const e=Math.pow(1-i/len,decay);d[i]=(Math.random()*2-1)*e*(gated?1.25:1)}}return b}
  function env(at,a,h,r,p){const g=ctx.createGain();g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(p,at+a);g.gain.setValueAtTime(p,at+a+h);g.gain.exponentialRampToValueAtTime(.0001,at+a+h+r);return g}
  function driveCurve(k=44){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}

  function init(){if(ctx){if(ctx.state==='suspended')ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.38;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-19;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.16;master.connect(comp).connect(ctx.destination);musicBus=ctx.createGain();musicBus.gain.value=.36;musicBus.connect(master);reverb=ctx.createConvolver();reverb.buffer=impulse();const rw=ctx.createGain();rw.gain.value=.18;reverb.connect(rw).connect(master);musicBus.connect(reverb);delay=ctx.createDelay(1);delay.delayTime.value=sixteenth*2;feedback=ctx.createGain();feedback.gain.value=.3;const dw=ctx.createGain();dw.gain.value=.12;delay.connect(feedback).connect(delay);delay.connect(dw).connect(master);delay.connect(reverb);drumVerb=ctx.createConvolver();drumVerb.buffer=impulse(1.42,1.1,true);drumWet=ctx.createGain();drumWet.gain.value=.5;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=165;drumVerb.connect(hp).connect(drumWet).connect(master);start();chirp(780,.05,.014)}

  function kick(at){const o=ctx.createOscillator(),g=env(at,.002,.014,.2,.78);o.type='sine';o.frequency.setValueAtTime(126,at);o.frequency.exponentialRampToValueAtTime(41,at+.13);o.connect(g).connect(master);o.start(at);o.stop(at+.25)}
  function snare(at){const len=Math.floor(ctx.sampleRate*.22),b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.55);const n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=b;hp.type='highpass';hp.frequency.value=820;g.gain.setValueAtTime(.21,at);g.gain.exponentialRampToValueAtTime(.0001,at+.2);n.connect(hp).connect(g).connect(master);const send=ctx.createGain();send.gain.value=.94;g.connect(send).connect(drumVerb);const o=ctx.createOscillator(),og=env(at,.001,.012,.22,.17);o.type='triangle';o.frequency.setValueAtTime(210,at);o.frequency.exponentialRampToValueAtTime(108,at+.15);o.connect(og).connect(master);const os=ctx.createGain();os.gain.value=.7;og.connect(os).connect(drumVerb);n.start(at);n.stop(at+.24);o.start(at);o.stop(at+.26)}
  function hat(at,open=false){const len=Math.floor(ctx.sampleRate*(open?.085:.032)),b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain(),pan=ctx.createStereoPanner();n.buffer=b;hp.type='highpass';hp.frequency.value=6500;pan.pan.value=(step%4<2?-.45:.45);g.gain.setValueAtTime(open?.04:.025,at);g.gain.exponentialRampToValueAtTime(.0001,at+(open?.085:.032));n.connect(hp).connect(g).connect(pan).connect(master);n.start(at);n.stop(at+.1)}
  function tom(at,f=150,l=.13){const o=ctx.createOscillator(),g=env(at,.001,.018,.26,l),p=ctx.createStereoPanner();p.pan.value=f>150?-.48:.48;o.type='sine';o.frequency.setValueAtTime(f*1.18,at);o.frequency.exponentialRampToValueAtTime(f*.7,at+.23);o.connect(g).connect(p).connect(master);const send=ctx.createGain();send.gain.value=.88;g.connect(send).connect(drumVerb);o.start(at);o.stop(at+.35)}

  function bassNote(note,at,dur=.22){const mid1=ctx.createOscillator(),mid2=ctx.createOscillator(),sub1=ctx.createOscillator(),sub2=ctx.createOscillator(),f=ctx.createBiquadFilter(),sf1=ctx.createBiquadFilter(),sf2=ctx.createBiquadFilter(),g=env(at,.003,.07,dur,.19),g1=env(at,.002,.09,dur+.05,.155),g2=env(at,.002,.08,dur+.04,.09),p1=ctx.createStereoPanner(),p2=ctx.createStereoPanner();p1.pan.value=-.05;p2.pan.value=.05;mid1.type='sawtooth';mid2.type='square';sub1.type='sine';sub2.type='triangle';mid1.frequency.value=midi(note);mid2.frequency.value=midi(note-12);mid2.detune.value=-5;sub1.frequency.value=midi(note-12);sub2.frequency.value=midi(note-12);sub2.detune.value=3;f.type='lowpass';f.frequency.value=620;f.Q.value=6.2;sf1.type='lowpass';sf1.frequency.value=115;sf2.type='lowpass';sf2.frequency.value=170;mid1.connect(f);mid2.connect(f);f.connect(g).connect(master);sub1.connect(sf1).connect(g1).connect(p1).connect(master);sub2.connect(sf2).connect(g2).connect(p2).connect(master);[mid1,mid2,sub1,sub2].forEach(o=>o.start(at));mid1.stop(at+dur+.18);mid2.stop(at+dur+.18);sub1.stop(at+dur+.25);sub2.stop(at+dur+.22)}

  function synthNote(note,at,accent=false){const mix=ctx.createGain(),f=ctx.createBiquadFilter(),shape=ctx.createWaveShaper(),clean=ctx.createGain(),dirty=ctx.createGain(),g=env(at,.001,.004,accent?.085:.068,accent?.07:.052);f.type='lowpass';f.frequency.setValueAtTime(accent?4100:3000,at);f.frequency.exponentialRampToValueAtTime(accent?1450:1050,at+.09);f.Q.value=accent?7.5:5.6;shape.curve=driveCurve(accent?62:46);shape.oversample='2x';clean.gain.value=.56;dirty.gain.value=.5;const det=[-19,-7,7,19],pans=[-.74,-.25,.25,.74],types=['sawtooth','sawtooth','square','sawtooth'];det.forEach((d,i)=>{const o=ctx.createOscillator(),p=ctx.createStereoPanner();o.type=types[i];o.frequency.value=midi(note);o.detune.value=d+(step%2?2:-2);p.pan.value=pans[i];o.connect(p).connect(mix);o.start(at);o.stop(at+.14)});mix.connect(f);f.connect(clean).connect(g);f.connect(shape).connect(dirty).connect(g);g.connect(musicBus);const ds=ctx.createGain();ds.gain.value=accent?.62:.46;g.connect(ds).connect(delay);const rs=ctx.createGain();rs.gain.value=accent?.12:.07;g.connect(rs).connect(reverb)}
  function rolling(note,at,dir=1){const det=[-12,-4,4,12],pans=[-.82,-.34,.34,.82];det.forEach((d,i)=>{const o=ctx.createOscillator(),p=ctx.createStereoPanner(),f=ctx.createBiquadFilter(),g=env(at,.001,.016,.105,.018);o.type='sawtooth';o.frequency.value=midi(note);o.detune.value=d;p.pan.value=pans[i]*dir;f.type='bandpass';f.frequency.value=1300+i*390+(step%4)*190;f.Q.value=4.6;o.connect(f).connect(g).connect(p).connect(musicBus);o.start(at);o.stop(at+.15)})}
  function pad(v,at){v.forEach((n,i)=>{const o=ctx.createOscillator(),p=ctx.createStereoPanner(),f=ctx.createBiquadFilter(),g=env(at,.08,.1,.44,.012);o.type=i%2?'triangle':'sawtooth';o.frequency.value=midi(n);o.detune.value=(i-1.5)*6;p.pan.value=[-.68,-.22,.22,.68][i];f.type='lowpass';f.frequency.value=670;o.connect(f).connect(g).connect(p).connect(reverb);o.start(at);o.stop(at+.85)})}

  function schedule(s,at){if(!audioOn)return;const b=s%16;if(b%4===0)kick(at);if(b===4||b===12)snare(at);if(b%2===0)hat(at,b===14);synthNote(arp[b],at,[0,1,4,6,8,10,12,14,15].includes(b));rolling(pent[(b+Math.floor(s/16))%pent.length]+(b%4===3?12:0),at+sixteenth*.17,b%2?-1:1);if([3,7,11,15].includes(b))synthNote([50,55,53,57][Math.floor(b/4)],at+sixteenth*.34,true);const root=bass[Math.floor((s/16)%4)];if(b%2===0)bassNote(root+(b%4===2?12:0),at,b%4===2?.12:.2);if([3,7,11,15].includes(b))bassNote(root,at+sixteenth*.13,.082);if(b===0)pad(pads[Math.floor((s/16)%4)],at);if(Math.floor(s/16)%2===1){if(b===10)tom(at,178,.12);if(b===13)tom(at,142,.135);if(b===15)tom(at,108,.16)}}
  function scheduler(){if(!ctx)return;while(nextStep<ctx.currentTime+lookAhead){schedule(step,nextStep);nextStep+=sixteenth;step=(step+1)%64}}
  function start(){if(started||!ctx)return;started=true;nextStep=ctx.currentTime+.06;timer=setInterval(scheduler,25)}
  function chirp(freq=820,dur=.04,level=.01){if(!audioOn||!ctx)return;const at=ctx.currentTime,o=ctx.createOscillator(),g=env(at,.002,.002,dur,level);o.type='square';o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(freq*.76,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.02)}
  function setAudio(on){audioOn=on;button.textContent=on?'SFX // ON':'SFX // OFF';if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(on?.38:.0001,ctx.currentTime,.035)}}
  document.addEventListener('pointerdown',init,{once:true});document.addEventListener('keydown',init,{once:true});document.querySelectorAll('a,button').forEach((el,i)=>el.addEventListener('mouseenter',()=>{init();chirp(610+i*90,.025,.008)}));button.addEventListener('click',()=>{init();setAudio(!audioOn);if(audioOn)chirp(990,.05,.014)});button.textContent='SFX // ON';
})();
