(()=>{const root=document.documentElement,c=document.getElementById('storm'),x=c.getContext('2d');if(matchMedia('(prefers-reduced-motion: reduce)').matches||!x)return;let w,h,d,pts;function resize(){d=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(d,0,0,d,0,0);pts=Array.from({length:Math.min(72,Math.max(36,Math.floor(w/22)))},()=>({x:Math.random()*w,y:Math.random()*h,v:.8+Math.random()*3.5,l:8+Math.random()*40,a:.04+Math.random()*.18,dr:(Math.random()-.5)*.35}))}resize();addEventListener('resize',resize,{passive:true});addEventListener('pointermove',e=>{root.style.setProperty('--mx',((e.clientX/innerWidth)-.5).toFixed(3));root.style.setProperty('--my',((e.clientY/innerHeight)-.5).toFixed(3))},{passive:true});(function draw(){x.clearRect(0,0,w,h);for(const p of pts){p.y+=p.v;p.x+=p.dr;if(p.y>h+50){p.y=-50;p.x=Math.random()*w}x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.dr*8,p.y-p.l);x.strokeStyle=`rgba(104,255,219,${p.a})`;x.stroke()}requestAnimationFrame(draw)})()})();
(()=>{const b=document.getElementById('sfx');let ctx,master,music,reverb,timer,next=0,step=0,on=true,started=false;const bpm=112,eighth=60/bpm/2,look=.12,midi=n=>440*Math.pow(2,(n-69)/12),bass=[38,38,36,36,34,34,36,36],arp=[62,65,69,65,60,65,67,65],pads=[[50,53,57],[48,53,57],[46,50,53],[48,52,55]];function imp(sec=1.5,dec=3.2){const r=ctx.sampleRate,l=Math.floor(r*sec),z=ctx.createBuffer(2,l,r);for(let c=0;c<2;c++){const a=z.getChannelData(c);for(let i=0;i<l;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/l,dec)}return z}function eg(at,a,h,r,p){const g=ctx.createGain();g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(p,at+a);g.gain.setValueAtTime(p,at+a+h);g.gain.exponentialRampToValueAtTime(.0001,at+a+h+r);return g}function init(){if(ctx){ctx.state==='suspended'&&ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC;master=ctx.createGain();master.gain.value=.34;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.2;master.connect(comp).connect(ctx.destination);music=ctx.createGain();music.gain.value=.3;music.connect(master);reverb=ctx.createConvolver();reverb.buffer=imp();const rw=ctx.createGain();rw.gain.value=.16;reverb.connect(rw).connect(master);music.connect(reverb);start()}function kick(at){const o=ctx.createOscillator(),g=eg(at,.002,.02,.18,.72);o.type='sine';o.frequency.setValueAtTime(118,at);o.frequency.exponentialRampToValueAtTime(43,at+.12);o.connect(g).connect(master);o.start(at);o.stop(at+.22)}function snare(at){const l=Math.floor(ctx.sampleRate*.18),z=ctx.createBuffer(1,l,ctx.sampleRate),a=z.getChannelData(0);for(let i=0;i<l;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/l,1.7);const n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=z;hp.type='highpass';hp.frequency.value=1000;g.gain.setValueAtTime(.14,at);g.gain.exponentialRampToValueAtTime(.0001,at+.17);n.connect(hp).connect(g).connect(master);const s=ctx.createGain();s.gain.value=.34;g.connect(s).connect(reverb);n.start(at);n.stop(at+.2)}function hat(at){const l=Math.floor(ctx.sampleRate*.025),z=ctx.createBuffer(1,l,ctx.sampleRate),a=z.getChannelData(0);for(let i=0;i<l;i++)a[i]=Math.random()*2-1;const n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=z;hp.type='highpass';hp.frequency.value=7000;g.gain.setValueAtTime(.018,at);g.gain.exponentialRampToValueAtTime(.0001,at+.025);n.connect(hp).connect(g).connect(master);n.start(at);n.stop(at+.04)}function bassNote(n,at){const s=ctx.createOscillator(),sq=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.003,.12,.21,.18);s.type='sine';sq.type='sawtooth';s.frequency.value=midi(n-12);sq.frequency.value=midi(n);f.type='lowpass';f.frequency.value=420;f.Q.value=4;s.connect(g).connect(master);sq.connect(f).connect(g);s.start(at);sq.start(at);s.stop(at+.4);sq.stop(at+.4)}function arpNote(n,at){const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.004,.04,.16,.033),p=ctx.createStereoPanner();o.type='sawtooth';o.frequency.value=midi(n);f.type='lowpass';f.frequency.value=1700;f.Q.value=3;p.pan.value=step%2?-.34:.34;o.connect(f).connect(g).connect(p).connect(music);o.start(at);o.stop(at+.28)}function pad(v,at){v.forEach((n,i)=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.06,.6,.55,.013),p=ctx.createStereoPanner();o.type='sawtooth';o.frequency.value=midi(n);o.detune.value=(i-1)*5;f.type='lowpass';f.frequency.value=620;p.pan.value=[-.5,0,.5][i];o.connect(f).connect(g).connect(p).connect(reverb);o.start(at);o.stop(at+1.4)})}function sched(s,at){if(!on)return;const q=s%8;if(q%2===0)kick(at);if(q===2||q===6)snare(at);hat(at);bassNote(bass[q],at);if(q%2===1)arpNote(arp[q],at);if(q===0)pad(pads[Math.floor((s/8)%4)],at)}function scheduler(){while(next<ctx.currentTime+look){sched(step,next);next+=eighth;step=(step+1)%32}}function start(){if(started)return;started=true;next=ctx.currentTime+.06;timer=setInterval(scheduler,25)}document.addEventListener('pointerdown',init,{once:true});document.addEventListener('keydown',init,{once:true});b.addEventListener('click',()=>{init();on=!on;b.textContent=on?'SFX // ON':'SFX // OFF';if(ctx)master.gain.setTargetAtTime(on?.34:.0001,ctx.currentTime,.035)})})();
</script>
