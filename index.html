ip b2"></i><i class="blip b3"></i></div></div></section><section class="visual"><img src="assets/rotund-operator.webp" alt="Rotund tabby cat in front of a cyber workstation"><div class="monitor-glow"></div><div class="signal"><b>STATUS</b> // OPERATIONAL</div><div class="label"><b>ROTUND_OPERATOR</b> // MAX SIGNAL</div></section></main></div><script>(()=>{const button=document.getElementById('sfx');let ctx,master,musicBus,dryBus,wetBus,delay,feedback,reverb,drumVerb,drumVerbWet,audioOn=true,started=false,timer=null,nextStep=0,step=0;const bpm=116,sixteenth=60/bpm/4,lookAhead=.12,scheduleEvery=25,midi=n=>440*Math.pow(2,(n-69)/12),pent=[62,65,67,69,72],arp=[62,69,72,77,67,74,69,79,62,72,65,69,60,67,69,74],bass=[38,36,31,33],padVoicings=[[50,53,57,60],[48,50,55,57],[43,50,53,57],[45,50,55,60]];function impulse(seconds=1.9,decay=4.2){const rate=ctx.sampleRate,length=Math.floor(rate*seconds),b=ctx.createBuffer(2,length,rate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay)}return b}function gated(seconds=1.45,gateAt=.92){const rate=ctx.sampleRate,length=Math.floor(rate*seconds),gate=Math.floor(rate*gateAt),b=ctx.createBuffer(2,length,rate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<length;i++){if(i>=gate){d[i]=0;continue}const x=i/gate;d[i]=(Math.random()*2-1)*(1-x*.42)*(.72+Math.random()*.28)*(i<rate*.075?1.2:1)}}return b}function init(){if(ctx){ctx.state==='suspended'&&ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC;master=ctx.createGain();master.gain.value=.34;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=16;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.18;master.connect(comp).connect(ctx.destination);musicBus=ctx.createGain();musicBus.gain.value=.32;dryBus=ctx.createGain();dryBus.gain.value=.78;wetBus=ctx.createGain();wetBus.gain.value=.19;reverb=ctx.createConvolver();reverb.buffer=impulse();drumVerb=ctx.createConvolver();drumVerb.buffer=gated();drumVerbWet=ctx.createGain();drumVerbWet.gain.value=.46;const dt=ctx.createBiquadFilter(),dc=ctx.createDynamicsCompressor();dt.type='highpass';dt.frequency.value=170;dc.threshold.value=-22;dc.knee.value=4;dc.ratio.value=8;dc.attack.value=.002;dc.release.value=.11;drumVerb.connect(dt).connect(dc).connect(drumVerbWet).connect(master);delay=ctx.createDelay(1);delay.delayTime.value=sixteenth*2;feedback=ctx.createGain();feedback.gain.value=.31;const dw=ctx.createGain();dw.gain.value=.15;musicBus.connect(dryBus).connect(master);musicBus.connect(reverb).connect(wetBus).connect(master);delay.connect(feedback).connect(delay);delay.connect(dw).connect(master);delay.connect(reverb);startLoop();chirp(760,.05,.018)}function eg(at,a,h,r,p){const g=ctx.createGain();g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(p,at+a);g.gain.setValueAtTime(p,at+a+h);g.gain.exponentialRampToValueAtTime(.0001,at+a+h+r);return g}function kick(at){const o=ctx.createOscillator(),g=eg(at,.002,.015,.18,.75);o.type='sine';o.frequency.setValueAtTime(120,at);o.frequency.exponentialRampToValueAtTime(43,at+.12);o.connect(g).connect(master);o.start(at);o.stop(at+.24)}function snare(at){const length=Math.floor(ctx.sampleRate*.22),b=ctx.createBuffer(1,length,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/length,1.65);const n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=b;hp.type='highpass';hp.frequency.value=850;g.gain.setValueAtTime(.19,at);g.gain.exponentialRampToValueAtTime(.0001,at+.19);n.connect(hp).connect(g).connect(master);const rs=ctx.createGain();rs.gain.value=.88;g.connect(rs).connect(drumVerb);const body=ctx.createOscillator(),bg=eg(at,.001,.012,.22,.16);body.type='triangle';body.frequency.setValueAtTime(205,at);body.frequency.exponentialRampToValueAtTime(112,at+.14);body.connect(bg).connect(master);const br=ctx.createGain();br.gain.value=.62;bg.connect(br).connect(drumVerb);body.start(at);body.stop(at+.25);n.start(at);n.stop(at+.24)}function tom(at,freq=150,level=.13){const o=ctx.createOscillator(),g=eg(at,.001,.018,.26,level);o.type='sine';o.frequency.setValueAtTime(freq*1.16,at);o.frequency.exponentialRampToValueAtTime(freq*.72,at+.23);o.connect(g).connect(master);const s=ctx.createGain();s.gain.value=.82;g.connect(s).connect(drumVerb);o.start(at);o.stop(at+.34)}function hat(at,open=false){const length=Math.floor(ctx.sampleRate*(open?.09:.035)),b=ctx.createBuffer(1,length,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<length;i++)d[i]=Math.random()*2-1;const n=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=b;hp.type='highpass';hp.frequency.value=6200;g.gain.setValueAtTime(open?.035:.024,at);g.gain.exponentialRampToValueAtTime(.0001,at+(open?.09:.035));n.connect(hp).connect(g).connect(master);n.start(at);n.stop(at+(open?.1:.05))}function bassNote(note,at,dur=.24){[-4,4].forEach((det,i)=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.006,.06,dur,.055),pan=ctx.createStereoPanner();o.type=i?'square':'sawtooth';o.frequency.value=midi(note-(i?12:0));o.detune.value=det;f.type='lowpass';f.frequency.value=i?340:470;f.Q.value=i?4:6;pan.pan.value=i?.08:-.08;o.connect(f).connect(g).connect(pan).connect(master);o.start(at);o.stop(at+dur+.18)})}function voice(note,at,det,panV,dirty=false){const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.002,.008,.085,.018),pan=ctx.createStereoPanner();o.type=dirty?'square':'sawtooth';o.frequency.value=midi(note);o.detune.value=det;f.type='bandpass';f.frequency.value=dirty?1850:1450;f.Q.value=dirty?3.4:2.5;pan.pan.value=panV;o.connect(f).connect(g).connect(pan);pan.connect(musicBus);const s=ctx.createGain();s.gain.value=dirty?.58:.78;pan.connect(s).connect(delay);const rv=ctx.createGain();rv.gain.value=.18;pan.connect(rv).connect(reverb);o.start(at);o.stop(at+.15)}function arpNote(note,at){voice(note,at,-10,-.7,false);voice(note,at,6,-.24,true);voice(note,at,-4,.24,false);voice(note,at,11,.7,true)}function rolling(at,s){const seq=[62,67,69,72,65,69,74,72],note=seq[s%seq.length]+(Math.floor(s/8)%2?12:0),pan=Math.sin(s*.72)*.78;const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.004,.025,.14,.018),p=ctx.createStereoPanner();o.type='triangle';o.frequency.value=midi(note);f.type='lowpass';f.frequency.setValueAtTime(700+(s%8)*120,at);f.Q.value=6;p.pan.value=pan;o.connect(f).connect(g).connect(p).connect(musicBus);const send=ctx.createGain();send.gain.value=.55;p.connect(send).connect(delay);o.start(at);o.stop(at+.22)}function padChord(v,at){v.forEach((note,i)=>[-8,8].forEach((det,j)=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=eg(at,.09,.11,.46,.008),p=ctx.createStereoPanner();o.type=(i+j)%2?'triangle':'sawtooth';o.frequency.value=midi(note);o.detune.value=det+(i-1.5)*3;f.type='lowpass';f.frequency.value=640;f.Q.value=1.1;p.pan.value=(i-1.5)*.3+(j? .1:-.1);o.connect(f).connect(g).connect(p);const dry=ctx.createGain();dry.gain.value=.3;p.connect(dry).connect(musicBus);const send=ctx.createGain();send.gain.value=.82;p.connect(send).connect(reverb);o.start(at);o.stop(at+.92)}))}function schedule(s,at){if(!audioOn)return;const b=s%16;b%4===0&&kick(at);(b===4||b===12)&&snare(at);b%2===0&&hat(at,b===14);arpNote(arp[b],at);rolling(at,s);b%2===0&&bassNote(bass[Math.floor(s/16)%4]+(b%4===2?12:0),at,b%4===2?.11:.2);b===0&&padChord(padVoicings[Math.floor(s/16)%4],at);b===15&&Math.floor(s/16)%2===1&&arpNote(arp[15]+12,at);if(Math.floor(s/16)%2===1){b===10&&tom(at,176,.115);b===13&&tom(at,142,.125);b===15&&tom(at,112,.145)}}function scheduler(){if(!ctx)return;while(nextStep<ctx.currentTime+lookAhead){schedule(step,nextStep);nextStep+=sixteenth;step=(step+1)%64}}function startLoop(){if(started||!ctx)return;started=true;nextStep=ctx.currentTime+.06;timer=setInterval(scheduler,scheduleEvery)}function chirp(freq=820,dur=.04,level=.012){if(!audioOn||!ctx)return;const at=ctx.currentTime,o=ctx.createOscillator(),g=eg(at,.002,.002,dur,level);o.type='square';o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(freq*.76,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.03)}function setAudio(enabled){audioOn=enabled;button.textContent=enabled?'SFX // ON':'SFX // OFF';if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(enabled?.34:.0001,ctx.currentTime,.035)}}document.addEventListener('pointerdown',()=>init(),{once:true});document.addEventListener('keydown',()=>init(),{once:true});document.querySelectorAll('a,button').forEach((el,i)=>el.addEventListener('mouseenter',()=>{init();chirp(600+i*90,.025,.009)}));button.addEventListener('click',()=>{init();setAudio(!audioOn);audioOn&&chirp(980,.05,.015)});button.textContent='SFX // ON'})();</script></body></html>
