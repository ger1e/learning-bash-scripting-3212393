<script>
(()=>{
  const root=document.documentElement;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(matchMedia('(pointer:fine)').matches){addEventListener('pointermove',e=>{root.style.setProperty('--mx',((e.clientX/innerWidth)-.5).toFixed(3));root.style.setProperty('--my',((e.clientY/innerHeight)-.5).toFixed(3))},{passive:true})}
  const c=document.getElementById('storm'),x=c.getContext('2d',{alpha:true});if(!x)return;
  let w=0,h=0,dpr=1,pts=[],raf=0,running=true;
  const make=()=>({x:Math.random()*w,y:Math.random()*h,v:1+Math.random()*3.8,l:10+Math.random()*40,a:.04+Math.random()*.16,dx:(Math.random()-.5)*.28});
  function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);pts=Array.from({length:Math.min(76,Math.max(36,Math.floor(w/22)))} ,make)}
  function draw(){if(!running)return;x.clearRect(0,0,w,h);x.lineWidth=1;for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>h+50){p.y=-50;p.x=Math.random()*w}if(p.x<0)p.x=w;if(p.x>w)p.x=0;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.dx*9,p.y-p.l);x.strokeStyle=`rgba(103,255,220,${p.a})`;x.stroke()}raf=requestAnimationFrame(draw)}
  let rt=0;addEventListener('resize',()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(resize)},{passive:true});
  document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running)draw();else cancelAnimationFrame(raf)});
  resize();draw();
})();
</script>
